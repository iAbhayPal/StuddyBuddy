<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>StudyBuddy</title>
<!-- Standalone version: open this file in any browser. Needs an Anthropic API key (🔑 button). -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{--bg:#f6f7fb;--fg:#0f172a;--card:#fff;--line:#e2e8f0;--mu:#64748b;--sh:0 1px 2px rgba(15,23,42,.06),0 6px 18px rgba(15,23,42,.07);--ac:#2563eb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1020;--fg:#e5e7eb;--card:#131a2e;--line:#243049;--mu:#94a3b8;--sh:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b1020;--fg:#e5e7eb;--card:#131a2e;--line:#243049;--mu:#94a3b8;--sh:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);color-scheme:dark}
*{box-sizing:border-box}html{height:100%;background:radial-gradient(900px 380px at 50% -120px,color-mix(in srgb,var(--ac) 16%,transparent),transparent),var(--bg)}
body{height:100%;margin:0 auto;max-width:820px;display:flex;flex-direction:column;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--fg)}
header{padding:14px 16px 0}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:1.2rem;background:linear-gradient(135deg,var(--ac),color-mix(in srgb,var(--ac) 60%,#000));box-shadow:var(--sh)}
h1{font-size:1.15rem;margin:0;line-height:1.2}.brand p{margin:0;font-size:.8rem;color:var(--mu)}
.tools{display:flex;align-items:center;gap:8px}
.sw{display:flex;gap:6px}.sw button{width:20px;height:20px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0;outline:0}
.sw button.on{border-color:var(--fg);box-shadow:0 0 0 2px var(--bg) inset}
.ic{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer;font-size:1rem;box-shadow:var(--sh)}
nav{display:inline-flex;gap:4px;margin:14px 0 10px;padding:4px;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--sh)}
nav button{border:0;background:none;color:var(--mu);padding:8px 18px;border-radius:9px;font-size:.95rem;cursor:pointer;font-weight:500}
nav button.on{background:linear-gradient(135deg,var(--ac),color-mix(in srgb,var(--ac) 60%,#000));color:#fff}
.tab{display:none;flex:1;min-height:0;flex-direction:column}.tab.on{display:flex}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh)}
#chat .card{flex:1;min-height:0;display:flex;flex-direction:column;margin:0 12px 12px;overflow:hidden}
.bar{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);font-size:.9rem;color:var(--mu);gap:8px}
.sl{display:flex;align-items:center;gap:8px;cursor:pointer;color:var(--fg)}
.sl input{appearance:none;width:36px;height:20px;border-radius:20px;background:var(--line);position:relative;cursor:pointer;transition:.2s;margin:0}
.sl input::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s}
.sl input:checked{background:var(--ac)}.sl input:checked::after{left:18px}.sl input:disabled{opacity:.5;cursor:not-allowed}
#log{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.r{display:flex;gap:8px;max-width:92%}.r.u{align-self:flex-end;flex-direction:row-reverse}
.av{flex:0 0 28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:.75rem;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--ac),color-mix(in srgb,var(--ac) 60%,#000))}
.b{padding:10px 14px;border-radius:14px;line-height:1.55;white-space:pre-wrap;word-wrap:break-word}
.a .b,.r:not(.u) .b{background:color-mix(in srgb,var(--fg) 5%,var(--card));border:1px solid var(--line);border-top-left-radius:4px}
.u .b{background:linear-gradient(135deg,var(--ac),color-mix(in srgb,var(--ac) 60%,#000));color:#fff;border-top-right-radius:4px}
.err{color:#ef4444}.dots i{display:inline-block;width:6px;height:6px;margin:0 2px;border-radius:50%;background:var(--mu);animation:d 1.2s infinite}.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes d{0%,80%,100%{opacity:.25}40%{opacity:1}}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:20px;padding:6px 12px;font-size:.85rem;cursor:pointer}
.chip:hover{border-color:var(--ac);color:var(--ac)}
.acts{margin-top:8px}.acts button{background:none;border:0;color:var(--mu);font-size:.8rem;cursor:pointer;padding:2px 6px;border-radius:6px}.acts button:hover{background:var(--line)}
details{margin-top:8px;font-size:.85rem}summary{cursor:pointer;color:var(--ac);font-weight:500}
.s{margin:8px 0;padding-left:10px;border-left:3px solid var(--ac)}.s small{color:var(--mu)}
form{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
input[type=text],input[type=number],textarea{flex:1;min-width:0;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--fg);font-size:1rem;font-family:inherit;outline:0}
input[type=text]:focus,input[type=number]:focus,textarea:focus{border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 22%,transparent)}
textarea{width:100%;min-height:90px;resize:vertical}
.p{background:linear-gradient(135deg,var(--ac),color-mix(in srgb,var(--ac) 60%,#000));color:#fff;border:0;border-radius:12px;padding:10px 18px;font-size:.95rem;font-weight:600;cursor:pointer;box-shadow:var(--sh)}
.p:hover{filter:brightness(1.08)}.g{background:var(--card);color:var(--mu);border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-size:.88rem;cursor:pointer}.g:hover{color:var(--fg)}
button:disabled{opacity:.5;cursor:not-allowed}
#notes{overflow-y:auto;padding:0 12px 16px;gap:14px}#notes section{padding:18px}
h2{font-size:1rem;margin:0 0 4px}.sub{margin:0 0 12px;color:var(--mu);font-size:.85rem}
.drop{display:block;border:2px dashed var(--line);border-radius:14px;padding:22px;text-align:center;color:var(--mu);cursor:pointer;transition:.15s}
.drop:hover,.drop.ov{border-color:var(--ac);color:var(--ac);background:color-mix(in srgb,var(--ac) 6%,transparent)}.drop input{display:none}.drop b{display:block;font-size:1.6rem}
.btns{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}.row{display:flex;gap:8px;margin-bottom:10px}.row input[type=number]{flex:0 0 84px}
.st{color:var(--mu);margin-top:8px;font-size:.88rem}
.docs{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.doc{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:10px;padding:5px 6px 5px 10px;font-size:.82rem;background:var(--bg)}.doc button{border:0;background:none;color:var(--mu);cursor:pointer;font-size:1rem}
.m{margin-top:12px;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);white-space:pre-wrap;line-height:1.55}
</style>
</head>
<body>
<header>
  <div class="top">
    <div class="brand"><div class="logo">S</div><div><h1>StudyBuddy</h1><p>Your AI study assistant</p></div></div>
    <div class="tools"><div class="sw" id="sw"></div><button id="key" class="ic" title="API key">🔑</button><button id="th" class="ic" title="Light / dark">🌙</button></div>
  </div>
  <nav><button id="t1" class="on">💬 Chat</button><button id="t2">📄 My notes</button></nav>
</header>

<div id="chat" class="tab on"><div class="card">
  <div class="bar"><label class="sl"><input type="checkbox" id="use"> Use my notes <span id="cnt" style="color:var(--mu)"></span></label><button id="nc" class="g">＋ New chat</button></div>
  <div id="log"></div>
  <form id="f"><input id="q" type="text" placeholder="Ask anything…" autocomplete="off"><button id="go" class="p">Send ➤</button></form>
</div></div>

<div id="notes" class="tab">
  <section class="card"><h2>Add your notes</h2><p class="sub">PDF, text or Markdown files. They stay in your browser.</p>
    <label class="drop" id="dz"><input id="files" type="file" accept=".pdf,.txt,.md" multiple><b>📥</b>Drop files here or tap to choose<div id="fn" class="st"></div></label>
    <p class="sub" style="margin-top:14px">Or paste text</p><textarea id="paste" placeholder="Paste lecture notes here"></textarea>
    <div class="btns"><button id="add" class="p">⬆ Add to notes</button><button id="clr" class="g">🗑 Clear all</button></div>
    <div id="ust" class="st"></div><div id="docs" class="docs"></div></section>
  <section class="card"><h2>Quiz me</h2><p class="sub">Practice questions generated from your notes.</p>
    <div class="row"><input id="topic" type="text" placeholder="Topic or chapter"><input id="n" type="number" value="5" min="1" max="10"></div>
    <button id="qz" class="p">✨ Generate quiz</button><div id="qo"></div></section>
</div>

<script>
const $=id=>document.getElementById(id),R=document.documentElement;
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e};
const store=(k,v)=>{try{v===undefined?0:localStorage.setItem(k,v);return localStorage.getItem(k)}catch(e){return null}};

// ---- theme ----
const ACC={Blue:"#2563eb",Violet:"#7c3aed",Emerald:"#059669",Rose:"#e11d48",Amber:"#d97706"};
function setAcc(n){R.style.setProperty("--ac",ACC[n]);document.querySelectorAll("#sw button").forEach(b=>b.classList.toggle("on",b.title===n));store("sb-acc",n)}
for(const n in ACC){const b=el("button");b.title=n;b.style.background=ACC[n];b.onclick=()=>setAcc(n);$("sw").append(b)}
const dark=()=>R.dataset.theme?R.dataset.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches;
function setTheme(t){R.dataset.theme=t;$("th").textContent=t==="dark"?"☀️":"🌙";store("sb-theme",t)}
$("th").onclick=()=>setTheme(dark()?"light":"dark");
setTheme(store("sb-theme")||(dark()?"dark":"light"));setAcc(store("sb-acc")&&ACC[store("sb-acc")]?store("sb-acc"):"Blue");

// ---- notes engine (BM25) ----
const STOP=new Set("the a an and or of to in is are was were it this that for on with as by be what how why which do does at from".split(" "));
const tok=t=>t.toLowerCase().split(/[^\p{L}\p{N}]+/u).filter(w=>w.length>1&&!STOP.has(w));
let chunks=[],tfs=[],lens=[],df={},avg=1,hist=[],sampleNs=null;
try{chunks=JSON.parse(store("sb-chunks")||"[]")}catch(e){}
function build(){tfs=[];lens=[];df={};
  for(const c of chunks){const t=tok(c.text),m={};t.forEach(w=>m[w]=(m[w]||0)+1);tfs.push(m);lens.push(t.length);for(const w in m)df[w]=(df[w]||0)+1}
  avg=lens.length?lens.reduce((a,b)=>a+b,0)/lens.length:1;
  $("cnt").textContent=chunks.length?"("+chunks.length+" chunks)":"(none yet)";$("use").disabled=!chunks.length;if(!chunks.length)$("use").checked=false;
  store("sb-chunks",JSON.stringify(chunks));docs()}
function docs(){const by={};chunks.forEach(c=>by[c.source]=(by[c.source]||0)+1);$("docs").replaceChildren();
  for(const s in by){const d=el("div","doc");d.append(el("span","","📄 "+s+" · "+by[s]));const x=el("button","","×");x.title="Remove";x.onclick=()=>{chunks=chunks.filter(c=>c.source!==s);build()};d.append(x);$("docs").append(d)}}
function addText(text,source,page){text=text.replace(/\s+/g," ").trim();
  for(let s=0;s<text.length;s+=650){const e=Math.min(text.length,s+800),p=text.slice(s,e).trim();if(p)chunks.push({text:p,source,page});if(e===text.length)break}}
function search(q,k){const n=chunks.length,terms=[...new Set(tok(q))],r=[];
  for(let i=0;i<n;i++){let sc=0;for(const t of terms){const f=tfs[i][t];if(!f)continue;const d=df[t];sc+=Math.log(1+(n-d+.5)/(d+.5))*f*2.5/(f+1.5*(.25+.75*lens[i]/avg))}if(sc>0)r.push({c:chunks[i],sc})}
  return r.sort((a,b)=>b.sc-a.sc).slice(0,k)}
const ctx=h=>h.map((x,i)=>"["+(i+1)+"] ("+x.c.source+", p."+x.c.page+")\n"+x.c.text).join("\n\n");

function getKey(){let k=store("sb-key");if(!k){k=prompt("Paste your Anthropic API key (it is saved only in this browser):");if(k){k=k.trim();store("sb-key",k)}}return k}
async function llm(messages,onText){
  const key=getKey();if(!key)throw new Error("Add your Anthropic API key with the 🔑 button to use the AI features.");
  const res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"x-api-key":key,"anthropic-version":"2023-06-01","content-type":"application/json","anthropic-dangerous-direct-browser-access":"true"},
    body:JSON.stringify({model:"claude-sonnet-5-5",max_tokens:1500,messages})});
  const data=await res.json().catch(()=>({}));
  if(!res.ok){if(res.status===401){try{localStorage.removeItem("sb-key")}catch(e){}}throw new Error((data.error&&data.error.message)||("Request failed ("+res.status+")"))}
  const text=(data.content||[]).map(b=>b.text||"").join("");if(onText)onText({text});return text}

$("key").onclick=()=>{const k=prompt("Anthropic API key (saved only in this browser). Leave empty to remove it:",store("sb-key")||"");if(k===null)return;try{k.trim()?localStorage.setItem("sb-key",k.trim()):localStorage.removeItem("sb-key")}catch(e){}};
// ---- tabs ----
const show=w=>{$("chat").classList.toggle("on",w==1);$("notes").classList.toggle("on",w==2);$("t1").classList.toggle("on",w==1);$("t2").classList.toggle("on",w==2)};
$("t1").onclick=()=>show(1);$("t2").onclick=()=>show(2);

// ---- chat ----
function row(cls,av){const r=el("div","r "+cls),b=el("div","b");if(cls!=="u")r.append(el("div","av",av||"S"));r.append(b);$("log").append(r);$("log").scrollTop=1e9;return b}
function welcome(){const b=row("a");b.textContent="Hi! I’m StudyBuddy. Ask me anything, or add notes and I’ll answer from them with page citations.";
  const c=el("div","chips");[["💡 Explain a topic","Explain this topic simply: "],["📄 Summarize my notes","Summarize the key points of my notes",1],["🧠 Test me","Ask me 3 quick questions about my notes",1]].forEach(([l,t,n])=>{const x=el("button","chip",l);x.onclick=()=>{$("q").value=t;if(n&&chunks.length)$("use").checked=true;$("q").focus()};c.append(x)});b.append(c)}
welcome();
$("f").onsubmit=async e=>{e.preventDefault();const q=$("q").value.trim();if(!q)return;$("q").value="";
  row("u").textContent=q;const bot=row("a");bot.innerHTML='<span class="dots"><i></i><i></i><i></i></span>';$("go").disabled=true;
  let hits=[],pre="You are StudyBuddy, a friendly, concise assistant that helps students learn. ";
  if($("use").checked&&chunks.length){hits=search(q,4);
    if(hits.length)pre+="The student’s uploaded notes are below. Prefer them when relevant and cite inline like [1], [2]. If the answer isn’t in the notes, say so briefly, then help from general knowledge.\n\n"+ctx(hits)+"\n\n"}
  try{const text=await llm(hist.slice(-20).concat([{role:"user",content:pre+"Student: "+q}]),({text})=>{bot.textContent=text;$("log").scrollTop=1e9});
    bot.textContent=text;hist.push({role:"user",content:q},{role:"assistant",content:text});
    const a=el("div","acts"),cp=el("button","","📋 Copy");cp.onclick=async()=>{try{await navigator.clipboard.writeText(text);cp.textContent="✓ Copied"}catch(x){cp.textContent="Copy unavailable"}};a.append(cp);bot.append(a);
    if(hits.length){const d=el("details");d.append(el("summary","","Sources ("+hits.length+")"));
      hits.forEach((h,i)=>{const s=el("div","s");s.append(el("strong","","["+(i+1)+"] "+h.c.source+", page "+h.c.page+" "),el("small","","(score "+h.sc.toFixed(2)+")"),el("div","",h.c.text.slice(0,300)+"…"));d.append(s)});bot.append(d)}
  }catch(er){bot.classList.add("err");bot.textContent=er.message||"Something went wrong."}
  $("go").disabled=false;$("q").focus();$("log").scrollTop=1e9};
$("nc").onclick=()=>{hist=[];$("log").replaceChildren();welcome()};

// ---- notes UI ----
$("files").onchange=()=>$("fn").textContent=[...$("files").files].map(f=>f.name).join(", ");
const dz=$("dz");["dragover","dragenter"].forEach(v=>dz.addEventListener(v,e=>{e.preventDefault();dz.classList.add("ov")}));
["dragleave","drop"].forEach(v=>dz.addEventListener(v,e=>{e.preventDefault();dz.classList.remove("ov")}));
dz.addEventListener("drop",e=>{$("files").files=e.dataTransfer.files;$("files").onchange()});
async function readPdf(f){const pdf=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;
  for(let p=1;p<=pdf.numPages;p++){const tc=await(await pdf.getPage(p)).getTextContent();addText(tc.items.map(i=>i.str).join(" "),f.name,p)}}
$("add").onclick=async()=>{const fs=[...$("files").files],pt=$("paste").value.trim();
  if(!fs.length&&!pt){$("ust").textContent="Choose a file or paste some text.";return}
  $("add").disabled=true;$("ust").textContent="Reading…";const before=chunks.length;
  try{for(const f of fs){
      if(/\.pdf$/i.test(f.name)){if(!window.pdfjsLib)throw new Error("PDF reader didn’t load. Try a .txt file or paste text.");
        pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";await readPdf(f)}
      else{const t=await f.text();for(let i=0,pg=1;i<t.length;i+=3000,pg++)addText(t.slice(i,i+3000),f.name,pg)}}
    if(pt){for(let i=0,pg=1;i<pt.length;i+=3000,pg++)addText(pt.slice(i,i+3000),"Pasted notes",pg);$("paste").value=""}
    build();const d=chunks.length-before;$("files").value="";$("fn").textContent="";
    $("ust").textContent=d?"✓ Added "+d+" chunks. Switch to Chat and turn on “Use my notes”.":"No text found. Scanned PDFs need OCR first."}
  catch(er){build();$("ust").textContent=er.message||"Couldn’t read that file."}
  $("add").disabled=false};
$("clr").onclick=()=>{chunks=[];build();$("qo").replaceChildren();$("ust").textContent="Notes cleared."};
$("qz").onclick=async()=>{const t=$("topic").value.trim();if(!t)return;
  if(!chunks.length){const o=el("div","m err","Add some notes first.");$("qo").replaceChildren(o);return}
  const hits=search(t,6),o=el("div","m",hits.length?"Writing questions…":"I couldn’t find that topic in your notes.");$("qo").replaceChildren(o);if(!hits.length)return;
  $("qz").disabled=true;const n=Math.max(1,Math.min(10,parseInt($("n").value,10)||5));
  try{o.textContent=await llm([{role:"user",content:"Using ONLY these notes, write "+n+" multiple-choice questions on “"+t+"”. Give 4 options each, then an answer key at the end with the page number for each answer.\n\nNotes:\n"+ctx(hits)}],({text})=>{o.textContent=text})}
  catch(er){o.classList.add("err");o.textContent=er.message||"Something went wrong."}
  $("qz").disabled=false};
build();
</script>
</body>
</html>
